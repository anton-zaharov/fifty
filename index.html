<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Антон М. Захаров">
<title>Пятнашки и циклы перестановок</title>
<meta name="description" content="На примере игры Пятнашки стоится матрица перестановок для визуализации циклов и инверсий, что также позваляет находить минимальное количества перестановок, восстанавливающих последовательность.">
<style>
  :root {
    --bs: min(calc(100vw - 72px), 420px); /* сторона доски: 72px = поля страницы + padding карточки */
    --bg: #f4f1ea;
    --panel: #ffffff;
    --text: #23211d;
    --muted: #7b766b;
    --board: #3b4a5a;
    --hole: #2e3a47;
    --tile: #f6e7c1;
    --tile-text: #3a2f14;
    --tile-home: #cfe8c4;
    --grid: #d9d4c7;
    --diag: #efeadc;
    --ok: #9bd08a;
    --btn: #23211d;
    --btn-text: #fff;
    --shadow: 0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c;
      --panel: #212529;
      --text: #ecebe6;
      --muted: #9a978e;
      --board: #0f1318;
      --hole: #0a0d11;
      --tile: #e9d7a6;
      --tile-text: #2d2410;
      --tile-home: #a9d49b;
      --grid: #343a40;
      --diag: #2a2f35;
      --ok: #6fae5f;
      --btn: #ecebe6;
      --btn-text: #17191c;
      --shadow: 0 2px 0 rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 24px 16px 40px;
  }
  .langbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .langbar select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--grid);
    border-radius: 8px; padding: 5px 8px; cursor: pointer;
  }
  h1 { margin: 0 0 4px; font-size: 26px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 auto 24px; max-width: 900px; font-size: 14px; line-height: 1.5; }
  main { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
  .card { background: var(--panel); border-radius: 18px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text);
    border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
  }
  button:active { transform: translateY(1px); }

  .game { width: calc(var(--bs) + 40px); } /* ширина карточки задана размером доски, а не длиной текста подсказки */
  .board { position: relative; width: var(--bs); height: var(--bs);
    background: var(--board); border-radius: 16px; }
  .grid { position: absolute; inset: 8px; border-radius: 10px; background: var(--hole); }
  .tile {
    position: absolute; left: 0; top: 0; width: 25%; height: 25%; padding: 4px;
    transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%));
    transition: transform .22s cubic-bezier(.3,.7,.3,1);
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .face {
    position: relative; width: 100%; height: 100%; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--tile); color: var(--tile-text);
    font-size: calc(var(--bs) / 10); font-weight: 700;
    box-shadow: var(--shadow); transition: background .3s;
  }
  .tile.home .face { background: var(--tile-home); }
  .face::after {
    content: ""; position: absolute; top: 7px; right: 7px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--dot, transparent); transition: background .3s;
  }
  .win {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px;
    background: rgba(15,19,24,.82); color: #fff; border-radius: 16px;
    opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  .win.show { opacity: 1; pointer-events: auto; }
  .win b { font-size: 30px; }
  .win button { justify-self: center; margin-top: 10px; background: #fff; color: #111; }
  .modes { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  button.secondary { background: transparent; color: var(--text); border: 2px solid var(--text); padding: 8px 14px; }
  .right { display: flex; align-items: center; gap: 12px; }
  button.icon { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  button.icon svg { width: 18px; height: 18px; } /* иначе общее правило "svg { width: 100% }" растянет иконку */
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:active { transform: none; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; }
  .switch input { width: 18px; height: 18px; accent-color: #f2b705; cursor: pointer; }
  .board.free { outline: 3px dashed #f2b705; outline-offset: 4px; }
  .selbox {
    position: absolute; left: 0; top: 0; width: 25%; height: 25%; padding: 4px; pointer-events: none;
    transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%)); opacity: 0; transition: opacity .15s;
  }
  .selbox.on { opacity: 1; }
  .selbox i { display: block; width: 100%; height: 100%; border: 3px solid #f2b705; border-radius: 10px; }
  .hint { margin: 12px 0 0; font-size: 12px; line-height: 1.4; min-height: 4.2em; /* 3 строки: высота не прыгает при смене режима */
    color: var(--muted); text-align: center; }

  .matrix { width: min(92vw, 476px); }
  .matrix h2 { margin: 0 0 4px; font-size: 17px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--text); font-family: inherit; }
  .lbl { font-size: 11px; fill: var(--muted) !important; }
  .cell { fill: none; stroke: var(--grid); stroke-width: 1; }
  .cell.d { fill: var(--diag); }
  .hl rect { fill: #f2b705; opacity: .22; animation: fade .3s; }
  .hl rect:first-child { opacity: .5; }
  .hl-e rect { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
  @keyframes fade { from { opacity: 0; } }
  .one { transition: transform .3s cubic-bezier(.3,.7,.3,1); }
  .one circle, .one rect { transition: fill .3s; }
  .one text { font-size: 12px; font-weight: 700; fill: #111 !important; }
  .one rect { fill: none; stroke-width: 2.5; transition: stroke .3s; }
  .one:last-child text { fill: var(--text) !important; }
  .loop line {
    fill: none; stroke-width: 3; stroke-linecap: round; opacity: .9;
    stroke-dasharray: 1; stroke-dashoffset: 0;
    animation: draw .1s linear backwards;
  }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  .loop polygon { stroke: var(--panel); stroke-width: 1; stroke-linejoin: round; animation: pop .15s backwards; }
  @keyframes pop { from { opacity: 0; } }
  .legal { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
  .legal a { color: inherit; }
  .how { max-width: 964px; margin: 28px auto 0; font-size: 14px; line-height: 1.6; }
  .how h2 { margin: 0 0 10px; font-size: 17px; }
  .how p { margin: 0 0 10px; }
  .how p:last-child { margin-bottom: 0; }
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tools button { padding: 6px 12px; font-size: 13px; }
  .numbtns { display: flex; gap: 6px; justify-content: center; }
  .numbtn {
    width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 10px;
    background: transparent; color: var(--muted); border: 2px solid var(--grid);
    text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .numbtn svg { width: 28px; height: 28px; } /* общее правило "svg { width: 100% }" иначе растянет иконку */
  .numbtn:hover { color: var(--text); }
  .numbtn.active { color: var(--text); border-color: var(--text); background: var(--diag); }
  .cellno {
    position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2;
    transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%));
    width: 25%; height: 25%;
  }
  .cellno span {
    position: absolute; left: 9px; bottom: 7px; font-size: 11px; font-weight: 700; line-height: 1;
    padding: 2px 5px; border-radius: 6px; background: rgba(255,255,255,.7); color: #3a2f14;
  }
  #parity { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--grid); font-size: 14px; line-height: 1.5; }
  #parity b { font-variant-numeric: tabular-nums; }
  #cycles { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; align-items: center; }
  .chip { padding: 3px 10px; border-radius: 999px; border: 2px solid; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="langbar">
  <label for="lang">Language</label>
  <select id="lang">
    <option value="ru">Русский</option>
    <option value="en">English</option>
  </select>
</div>
<h1 data-i18n="title"></h1>
<p class="sub"><span data-i18n="sub"></span> <span data-i18n="cap"></span></p>

<main>
  <section class="card game">
    <div class="stats">
      <div class="stat"><span data-i18n="moves"></span><b id="moves">0</b></div>
      <div class="numbtns" id="numbtns" role="group" data-i18n-aria="numLabel"></div>
      <button id="shuffle" data-i18n="shuffle" data-i18n-title="shuffleTip"></button>
    </div>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="win" id="win">
        <b data-i18n="winTitle"></b>
        <span id="winText"></span>
        <button id="again" data-i18n="again"></button>
      </div>
    </div>
    <div class="modes">
      <button id="solve" class="secondary" data-i18n="solve"></button>
      <div class="right">
        <button id="undo" class="secondary icon" disabled data-i18n-title="undoTip" data-i18n-aria="undoTip">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <label class="switch"><input type="checkbox" id="free"> <span data-i18n="free"></span></label>
      </div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="card matrix">
    <div class="tools">
      <h2 data-i18n="matrixTitle"></h2>
      <button id="replay" data-i18n="replay" data-i18n-title="replayTip"></button>
    </div>
    <svg id="svg" role="img" data-i18n-aria="svgLabel"></svg>
    <div id="cycles"></div>
    <div id="parity"></div>
  </section>
</main>

<section class="card how">
  <h2 data-i18n="howTitle"></h2>
  <p data-i18n="howP1"></p>
  <p data-i18n="howP2"></p>
</section>

<footer class="legal">
  © 2026 Anton М. Zakharov · <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank" rel="noopener">Apache License 2.0</a>
</footer>

<script>
(function () {
  const N = 4, SZ = N * N, S = 28;
  const PALETTE = ['#e4572e', '#17bebb', '#ffc914', '#76b041', '#a05ce0', '#ff7bac', '#3d8bfd', '#f08a24'];
  const NS = 'http://www.w3.org/2000/svg';
  const label = v => v === SZ ? 'E' : String(v);

  // ---------- интернационализация (ru / en) ----------
  const ruPlural = (n, one, few, many) => {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many);
  };
  const I18N = {
    ru: {
      docTitle: 'Пятнашки и циклы',
      title: 'Пятнашки',
      sub: 'Клик по костяшке или стрелки на клавиатуре. Справа — матрица перестановки и циклы перестановок.',
      moves: 'Ходы', shuffle: 'Go', shuffleTip: 'Перемешать и начать заново', undoTip: 'Отменить ход (Ctrl+Z)',
      winTitle: 'Готово!', again: 'Ещё раз',
      winText: m => m + ' ' + ruPlural(m, 'ход', 'хода', 'ходов'),
      solve: 'Расставить по местам', free: 'Свободная замена',
      hintNormal: 'Можно кликнуть по дальней костяшке в ряду — сдвинется вся цепочка.',
      hintFree: 'Свободная замена: кликните две любые клетки (в том числе пустую или столбцы матрицы) — они поменяются местами. Каждая замена считается ходом.',
      matrixTitle: 'Матрица перестановок',
      replay: '▶ Трассировка', replayTip: 'Заново пройти по контурам циклов отрезок за отрезком',
      cap: 'Строки — значение костяшки, столбцы — позиция на поле, [E] — пустое поле. Ход — это сдвиг костяшки по горизонтали или по вертикали. На матрице перестановок сдвиг по горизонтали означает обмен столбца [E] с соседним справа/слева столбцом, сдвиг по вертикали - обмен [E] с 4-ым справа/слева столбцом. Подсвечены допустимые для хода столбцы. Для совершения хода можно кликнуть по подсвеченному столбцу.',
      svgLabel: 'Матрица перестановки с циклами',
      howTitle: 'Как на матрице отрисовывается поиск цикла.',
      howP1: 'Сначала смотрим на первый столбец и находим строку с единицей, по горизонтали движемся к диагональному элементу для этой строки, упираемся в него и продолжаем линию вверх или вниз к единице и так далее.',
      howP2: 'Выражаясь языком алгебры мы берем первый элемент и идем к позиции на которой он должен стоять, смотрим значение элемента на этой позиции и идем к позиции на которой он должен стоять и так далее...',
      tipSel: n => 'Выбрана позиция ' + n,
      tipE: 'Столбец пустого поля E',
      tipMove: (horiz, p, e) => (horiz ? 'Горизонтальный ход' : 'Вертикальный ход') + ': обмен столбцов ' + p + ' и ' + e + ' (E)',
      oneTitle: (isE, v, col) => (isE ? 'Пустое поле' : 'Костяшка ' + v) + ' на позиции ' + col,
      noteFixed: f => 'на своих местах: ' + f,
      pCycles: c => 'Циклов: <b>' + c + '</b>',
      pTransp: (t, parts) => 'Транспозиций (минимум): <b>' + t + '</b>' + (parts.length > 1 ? ' = ' + parts.join(' + ') : ''),
      pParity: even => 'Чётность перестановки: <b>' + (even ? 'чётная' : 'нечётная') + '</b>',
      pInv: inv => 'Инверсий (без E): <b>' + inv + '</b>',
      pRow: (even, inv, corr, isRow) => isRow
        ? 'Чётность с учётом строки E: <b>' + (even ? 'чётная' : 'нечётная') + '</b> (' + inv + ' + ' + corr + ' = ' + (inv + corr) + ')'
        : 'Чётность инверсий: <b>' + (even ? 'чётная' : 'нечётная') + '</b>',
      numLabel: 'Нумерация клеток',
      numRows: 'Построчно (слева направо, сверху вниз)',
      numSnake: 'Змейкой (нечётные ряды →, чётные ←)',
      numRings: 'По двум кругам (по часовой)',
      numQuarters: 'По четвертям (по часовой)',
      pSolv: ok => 'Собирается обычными ходами: <b>' + (ok ? 'да' : 'нет') + '</b>'
    },
    en: {
      docTitle: 'Fifteen Puzzle & Cycles',
      title: 'Fifteen Puzzle',
      sub: 'Click a tile or use the arrow keys. On the right: the permutation matrix and its cycles.',
      moves: 'Moves', shuffle: 'Go', shuffleTip: 'Shuffle and start over', undoTip: 'Undo move (Ctrl+Z)',
      winTitle: 'Solved!', again: 'Play again',
      winText: m => m + (m === 1 ? ' move' : ' moves'),
      solve: 'Put in order', free: 'Free swap',
      hintNormal: 'You can click a far tile in the row — the whole chain will slide.',
      hintFree: 'Free swap: click any two squares (including the empty one, or matrix columns) to swap them. Each swap counts as a move.',
      matrixTitle: 'Permutations matrix',
      replay: '▶ Trace', replayTip: 'Replay the cycle outlines segment by segment',
      cap: 'Rows are tile values, columns are board positions, [E] is the empty square. A move is a tile sliding horizontally or vertically. On the permutation matrix, a horizontal slide means swapping the [E] column with the adjacent column to the right/left; a vertical slide means swapping [E] with the 4th column to the right/left. The columns allowed for a move are highlighted. Click a highlighted column to make the move.',
      svgLabel: 'Permutation matrix with cycles',
      howTitle: 'How the cycle search is drawn on the matrix.',
      howP1: 'First we look at the first column and find the row with the one. We move horizontally to the diagonal element of that row, run into it, and continue the line up or down to a one, and so on.',
      howP2: 'In algebraic terms, we take the first element and go to the position where it should stand, look at the value of the element at that position, go to the position where that element should stand, and so on...',
      tipSel: n => 'Position ' + n + ' selected',
      tipE: 'Column of the empty square E',
      tipMove: (horiz, p, e) => (horiz ? 'Horizontal move' : 'Vertical move') + ': swap columns ' + p + ' and ' + e + ' (E)',
      oneTitle: (isE, v, col) => (isE ? 'Empty square' : 'Tile ' + v) + ' at position ' + col,
      noteFixed: f => 'in place: ' + f,
      pCycles: c => 'Cycles: <b>' + c + '</b>',
      pTransp: (t, parts) => 'Transpositions (minimum): <b>' + t + '</b>' + (parts.length > 1 ? ' = ' + parts.join(' + ') : ''),
      pParity: even => 'Permutation parity: <b>' + (even ? 'even' : 'odd') + '</b>',
      pInv: inv => 'Inversions (excluding E): <b>' + inv + '</b>',
      pRow: (even, inv, corr, isRow) => isRow
        ? 'Parity including the E row: <b>' + (even ? 'even' : 'odd') + '</b> (' + inv + ' + ' + corr + ' = ' + (inv + corr) + ')'
        : 'Inversion parity: <b>' + (even ? 'even' : 'odd') + '</b>',
      numLabel: 'Cell numbering',
      numRows: 'Row by row (left to right, top to bottom)',
      numSnake: 'Snake (odd rows →, even rows ←)',
      numRings: 'Two rings (clockwise)',
      numQuarters: 'By quarters (clockwise)',
      pSolv: ok => 'Solvable with regular moves: <b>' + (ok ? 'yes' : 'no') + '</b>'
    }
  };
  const storedLang = (() => { try { return localStorage.getItem('lang'); } catch (e) { return null; } })();
  let lang = I18N[storedLang] ? storedLang : (/^ru/i.test(navigator.language || '') ? 'ru' : 'en');
  const t = (key, ...args) => {
    const v = I18N[lang][key];
    return typeof v === 'function' ? v(...args) : v;
  };

  let board, moves, won;
  let free = false;  // режим произвольной замены
  let sel = null;    // выбранная позиция (0..15) в режиме свободной замены

  // ---------- нумерация клеток ----------
  // Нумерация задаёт «свои места»: костяшка v должна стоять в клетке с номером v.
  // order[k] — клетка поля (0..15, по строкам), имеющая номер k + 1.
  const snakeOrder = [], rowsOrder = [];
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++) {
      rowsOrder.push(r * N + c);
      snakeOrder.push(r * N + (r % 2 === 0 ? c : N - 1 - c)); // нечётные ряды (1-й, 3-й) слева направо, чётные — справа налево
    }
  // большой круг по периметру по часовой стрелке от верхней левой клетки, затем малый круг (центр 2×2) так же
  const ringsOrder = [[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[3,3],[3,2],[3,1],[3,0],[2,0],[1,0],
                      [1,1],[1,2],[2,2],[2,1]].map(([r, c]) => r * N + c);
  // по четвертям: верхняя левая, верхняя правая, нижняя левая, нижняя правая; в каждой четверти (2×2)
  // обход по часовой стрелке от её верхней левой клетки
  const quartersOrder = [];
  for (const [qr, qc] of [[0, 0], [0, 2], [2, 0], [2, 2]])
    for (const [dr, dc] of [[0, 0], [0, 1], [1, 1], [1, 0]]) quartersOrder.push((qr + dr) * N + qc + dc);
  const NUMBERINGS = [
    { id: 'rows', order: rowsOrder },
    { id: 'snake', order: snakeOrder },
    { id: 'rings', order: ringsOrder },
    { id: 'quarters', order: quartersOrder }
  ];
  let numbering = NUMBERINGS[0];
  let cellOf = numbering.order;                        // номер (0-based) -> клетка
  let idxOf = [];                                      // клетка -> номер (1-based)
  const setNumberingTables = () => { cellOf = numbering.order; cellOf.forEach((cell, k) => { idxOf[cell] = k + 1; }); };
  setNumberingTables();

  // ---------- доска ----------
  const gridEl = document.getElementById('grid');
  const tiles = [];
  for (let v = 1; v < SZ; v++) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML = '<div class="face">' + v + '</div>';
    gridEl.appendChild(t);
    tiles[v] = t;
  }
  const selBox = document.createElement('div');
  selBox.className = 'selbox';
  selBox.innerHTML = '<i></i>';
  gridEl.appendChild(selBox);

  // маленькие номера клеток в углу каждой клетки (показывают текущую нумерацию)
  const cellNos = [];
  for (let cell = 0; cell < SZ; cell++) {
    const d = document.createElement('div');
    d.className = 'cellno';
    d.style.setProperty('--r', Math.floor(cell / N));
    d.style.setProperty('--c', cell % N);
    d.innerHTML = '<span></span>';
    gridEl.appendChild(d);
    cellNos[cell] = d.firstChild;
  }
  const renderCellNos = () => cellNos.forEach((s, cell) => { s.textContent = idxOf[cell]; });

  // иконки выбора нумерации: ломаная соединяет центры клеток в порядке номеров 1…16 (кружок — клетка №1)
  const numBtns = document.getElementById('numbtns');
  const NUM_TITLE = { rows: 'numRows', snake: 'numSnake', rings: 'numRings', quarters: 'numQuarters' };
  NUMBERINGS.forEach(nb => {
    const xy = cell => [5 + 6 * (cell % N), 5 + 6 * Math.floor(cell / N)];
    const dots = Array.from({ length: SZ }, (_, cell) => xy(cell))
      .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.9" fill="currentColor" opacity=".45"/>`).join('');
    const pts = nb.order.map(cell => xy(cell).join(',')).join(' ');
    const [sx, sy] = xy(nb.order[0]);
    // это ссылка с параметром нумерации (её можно скопировать или открыть в новой вкладке),
    // а обычный клик перехватывается: страница не перезагружается
    const b = document.createElement('a');
    b.className = 'numbtn';
    b.href = '?numbering=' + nb.id;
    b.dataset.num = nb.id;
    b.dataset.i18nTitle = NUM_TITLE[nb.id];
    b.dataset.i18nAria = NUM_TITLE[nb.id];
    b.innerHTML = `<svg viewBox="0 0 28 28" aria-hidden="true">${dots}` +
      `<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>` +
      `<circle cx="${sx}" cy="${sy}" r="2.4" fill="currentColor"/></svg>`;
    b.addEventListener('click', ev => {
      // с модификаторами и средней кнопкой оставляем обычное поведение ссылки (новая вкладка и т. п.)
      if (ev.defaultPrevented || ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
      ev.preventDefault();
      chooseNumbering(nb.id);
      try { history.replaceState(null, '', b.getAttribute('href')); } catch (e) { /* адрес не меняем, например для file:// в части браузеров */ }
    });
    numBtns.appendChild(b);
  });
  // смена нумерации не трогает расположение костяшек: меняются только номера клеток («свои места»),
  // обнуляется счётчик ходов, а матрица, циклы и все параметры пересчитываются для той же расстановки
  function chooseNumbering(id) {
    numbering = NUMBERINGS.find(n => n.id === id);
    setNumberingTables();
    renderCellNos();
    numBtns.querySelectorAll('.numbtn').forEach(b => {
      const on = b.dataset.num === id;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
    if (!board) return; // первый вызов при запуске: партия ещё не создана
    moves = 0; sel = null; won = false;
    undoStack.length = 0; // записанные в стеке счётчики ходов относились к прежней нумерации
    document.getElementById('win').classList.remove('show');
    render();
  }

  // отмена хода: восстанавливаем расклад и счётчик ходов, время не трогаем
  const undoStack = [];
  const pushUndo = () => undoStack.push({ board: board.slice(), moves });
  function undo() {
    const s = undoStack.pop();
    if (!s) return;
    board = s.board; moves = s.moves; sel = null;
    if (won) { won = false; document.getElementById('win').classList.remove('show'); }
    render();
  }
  document.getElementById('undo').addEventListener('click', undo);
  document.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(); }
  });

  // клик по клетке (в том числе по пустой): обычный ход или выбор/обмен в свободном режиме
  function cellClick(idx) {
    if (!free) { moveAt(idx); return; }
    if (sel === null) sel = idx;
    else if (sel === idx) sel = null;
    else {
      pushUndo();
      [board[sel], board[idx]] = [board[idx], board[sel]];
      sel = null;
      moves++; // каждая замена — один ход
      if (won) { won = false; document.getElementById('win').classList.remove('show'); }
    }
    render();
  }
  gridEl.addEventListener('click', ev => {
    const r = gridEl.getBoundingClientRect();
    const c = Math.floor((ev.clientX - r.left) / r.width * N);
    const row = Math.floor((ev.clientY - r.top) / r.height * N);
    if (c >= 0 && c < N && row >= 0 && row < N) cellClick(row * N + c);
  });

  function setFree(on) {
    free = on; sel = null;
    document.getElementById('free').checked = on;
    document.getElementById('board').classList.toggle('free', on);
    updateHint();
    render();
  }
  function updateHint() {
    document.getElementById('hint').textContent = t(free ? 'hintFree' : 'hintNormal');
  }
  function solve() {
    board = Array.from({ length: SZ }, (_, cell) => idxOf[cell]);
    sel = null; moves = 0; won = false; undoStack.length = 0;
    document.getElementById('win').classList.remove('show');
    render();
  }
  document.getElementById('free').addEventListener('change', ev => setFree(ev.target.checked));
  document.getElementById('solve').addEventListener('click', solve);

  function neighbors(e) {
    const r = Math.floor(e / N), c = e % N, res = [];
    if (r > 0) res.push(e - N);
    if (r < N - 1) res.push(e + N);
    if (c > 0) res.push(e - 1);
    if (c < N - 1) res.push(e + 1);
    return res;
  }

  const isSolved = () => board.every((v, cell) => v === idxOf[cell]);

  function newGame() {
    do {
      board = Array.from({ length: SZ }, (_, cell) => idxOf[cell]);
      let e = cellOf[SZ - 1], prev = -1; // пустое поле стоит в клетке с номером 16
      for (let i = 0; i < 300; i++) {
        const opts = neighbors(e).filter(p => p !== prev);
        const nb = opts[Math.floor(Math.random() * opts.length)];
        board[e] = board[nb]; board[nb] = SZ;
        prev = e; e = nb;
      }
    } while (isSolved());
    moves = 0; won = false; sel = null; undoStack.length = 0;
    document.getElementById('win').classList.remove('show');
    render();
  }

  function moveAt(idx) {
    if (won || idx < 0) return;
    const e = board.indexOf(SZ);
    if (idx === e) return;
    const sameRow = Math.floor(idx / N) === Math.floor(e / N);
    const sameCol = idx % N === e % N;
    if (!sameRow && !sameCol) return;
    const step = sameRow ? (idx > e ? 1 : -1) : (idx > e ? N : -N);
    pushUndo();
    for (let k = e; k !== idx; k += step) board[k] = board[k + step];
    board[idx] = SZ;
    moves += Math.abs(idx - e) / Math.abs(step);
    render();
    if (isSolved()) win();
  }

  function win() {
    won = true;
    renderHighlights();
    setWinText();
    document.getElementById('win').classList.add('show');
  }
  function setWinText() {
    document.getElementById('winText').textContent = t('winText', moves);
  }

  document.addEventListener('keydown', ev => {
    if (free) return;
    const e = board.indexOf(SZ), r = Math.floor(e / N), c = e % N;
    let idx = -1;
    switch (ev.key) {
      case 'ArrowLeft':  if (c < N - 1) idx = e + 1; break;
      case 'ArrowRight': if (c > 0) idx = e - 1; break;
      case 'ArrowUp':    if (r < N - 1) idx = e + N; break;
      case 'ArrowDown':  if (r > 0) idx = e - N; break;
      default: return;
    }
    ev.preventDefault();
    moveAt(idx);
  });
  document.getElementById('shuffle').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);

  // ---------- матрица ----------
  const svg = document.getElementById('svg');
  const W = (SZ + 1) * S;
  svg.setAttribute('viewBox', `0 0 ${W} ${W}`);
  const el = (name, attrs, parent) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  };
  for (let i = 1; i <= SZ; i++) {
    const a = { class: 'lbl', 'text-anchor': 'middle', 'dominant-baseline': 'central' };
    el('text', { ...a, x: i * S + S / 2, y: S / 2 }).textContent = label(i);
    el('text', { ...a, x: S / 2, y: i * S + S / 2 }).textContent = label(i);
    for (let j = 1; j <= SZ; j++)
      el('rect', { class: 'cell' + (i === j ? ' d' : ''), x: j * S, y: i * S, width: S, height: S });
  }
  const hlG = el('g', {}); // подсветка столбцов, доступных для транспозиции с E
  const loopsG = el('g', {});
  const onesG = el('g', {});
  const ones = [];
  for (let v = 1; v <= SZ; v++) {
    const g = el('g', { class: 'one' }, onesG);
    if (v === SZ) el('rect', { x: 4, y: 4, width: S - 8, height: S - 8, rx: 2 }, g); // пустое поле — квадрат
    else el('circle', { cx: S / 2, cy: S / 2, r: S / 2 - 4 }, g);
    el('text', { x: S / 2, y: S / 2 + 1, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, g).textContent = v === SZ ? 'E' : '1';
    el('title', {}, g);
    ones[v] = g;
  }
  const loops = new Map(); // d -> <path>

  // значение, стоящее в клетке с номером n (1-based) — то есть образ n при перестановке
  const valueAt = n => board[cellOf[n - 1]];

  // циклы: seq = [старт, p1, p2, ...], где p(k+1) = valueAt(p(k))
  function findCycles() {
    const seen = new Array(SZ + 1).fill(false), res = [];
    for (let s = 1; s <= SZ; s++) {
      if (seen[s]) continue;
      const seq = [];
      let col = s;
      do { seen[col] = true; seq.push(col); col = valueAt(col); } while (col !== s);
      res.push(seq);
    }
    return res;
  }

  // вершины контура в пикселях: единица (r, col) -> диагональ (r, r) -> следующая единица ...
  function loopPoints(seq) {
    const pts = [];
    for (const col of seq) {
      const r = valueAt(col);
      pts.push([col, r], [r, r]); // [столбец, строка]
    }
    return pts.map(p => [p[0] * S + S / 2, p[1] * S + S / 2]);
  }

  const GAME_DRAW = 0.25; // в игре все отрезки всех циклов рисуются одновременно за столько секунд
  const TRACE_STEP = 0.5; // секунд на один отрезок в режиме трассировки (кнопка)
  let tracing = false;   // true только пока кнопка «Трассировка» перестраивает контуры
  let traceT = 0;        // момент (с), с которого начнёт рисоваться следующий цикл: циклы идут строго по очереди

  function buildLoop(pts, color) {
    const seg = tracing ? TRACE_STEP : GAME_DRAW;
    const t0 = tracing ? traceT : 0.25; // в игре ждём, пока единицы доедут до своих мест
    const g = el('g', { class: 'loop' }, loopsG);
    pts.forEach((a, i) => {
      const b = pts[(i + 1) % pts.length];
      // трассировка: отрезок i начинается, когда закончился отрезок i-1; в игре все стартуют вместе
      const start = tracing ? t0 + i * seg : t0;
      const ln = el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], pathLength: 1, stroke: color }, g);
      ln.style.animationDuration = seg + 's';
      ln.style.animationDelay = start + 's';
      // стрелка посередине отрезка, по направлению обхода; появляется, когда отрезок дорисован
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
      const ar = el('polygon', {
        points: '6,0 -4,-5 -4,5', fill: color,
        transform: `translate(${(a[0] + b[0]) / 2} ${(a[1] + b[1]) / 2}) rotate(${ang})`
      }, g);
      ar.style.animationDelay = (start + seg * 0.6) + 's';
    });
    if (tracing) traceT = t0 + pts.length * seg; // следующий цикл стартует после конца этого
    return g;
  }

  // E можно менять местами только с соседями по полю: это столбцы e±1 (в том же ряду) и e±4
  function renderHighlights() {
    hlG.replaceChildren();
    if (won) return;
    const e = board.indexOf(SZ);
    // столбец матрицы = номер клетки при выбранной нумерации (band принимает номер с 0)
    if (free) {
      if (sel !== null && sel !== e) band(idxOf[sel] - 1, 'hl', t('tipSel', idxOf[sel]));
      band(idxOf[e] - 1, 'hl-e', t('tipE'));
      return;
    }
    band(idxOf[e] - 1, 'hl-e', t('tipE'));
    for (const p of neighbors(e))
      band(idxOf[p] - 1, 'hl', t('tipMove', Math.floor(p / N) === Math.floor(e / N), idxOf[p], idxOf[e]));
  }
  function band(p, cls, tip) {
    const g = el('g', { class: cls }, hlG);
    el('rect', { x: (p + 1) * S, y: 0, width: S, height: S }, g);
    el('rect', { x: (p + 1) * S, y: S, width: S, height: SZ * S }, g);
    if (tip) el('title', {}, g).textContent = tip;
  }
  const colAt = ev => {
    const r = svg.getBoundingClientRect();
    return Math.floor((ev.clientX - r.left) / r.width * (SZ + 1)); // 1..16 — столбец, 0 — подписи
  };
  const canSwap = col => col >= 1 && (free || (!won && neighbors(board.indexOf(SZ)).includes(cellOf[col - 1])));
  svg.addEventListener('click', ev => { const c = colAt(ev); if (canSwap(c)) cellClick(cellOf[c - 1]); });
  svg.addEventListener('mousemove', ev => { svg.style.cursor = canSwap(colAt(ev)) ? 'pointer' : ''; });

  document.getElementById('replay').addEventListener('click', () => {
    for (const g of loops.values()) g.remove();
    loops.clear();
    tracing = true; traceT = 0.2;
    render();
    tracing = false;
  });

  function render() {
    // доска
    board.forEach((v, p) => {
      if (v === SZ) return;
      const t = tiles[v];
      t.style.setProperty('--r', Math.floor(p / N));
      t.style.setProperty('--c', p % N);
    });
    document.getElementById('moves').textContent = moves;
    document.getElementById('undo').disabled = undoStack.length === 0;

    selBox.classList.toggle('on', sel !== null);
    if (sel !== null) {
      selBox.style.setProperty('--r', Math.floor(sel / N));
      selBox.style.setProperty('--c', sel % N);
    }
    renderHighlights();

    // циклы
    const cycles = findCycles();
    const info = [];
    const keep = new Set();
    let fixed = 0;
    const chips = document.getElementById('cycles');
    chips.innerHTML = '';
    for (const seq of cycles) {
      const color = PALETTE[(Math.min(...seq) - 1) % PALETTE.length];
      if (seq.length === 1) {
        fixed++;
        info[seq[0]] = { fixed: true };
        continue;
      }
      seq.forEach(v => info[v] = { color });
      const pts = loopPoints(seq);
      const d = pts.join(';');
      keep.add(d);
      if (!loops.has(d)) loops.set(d, buildLoop(pts, color));
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.borderColor = color;
      chip.textContent = '(' + seq.map(label).join(' ') + ')';
      chips.appendChild(chip);
    }
    for (const [d, p] of loops) if (!keep.has(d)) { p.remove(); loops.delete(d); }
    const note = document.createElement('span');
    note.className = 'note';
    note.textContent = t('noteFixed', fixed);
    chips.appendChild(note);

    // минимальное число транспозиций = сумма (длина цикла − 1); циклы длины 1 (на своих местах) не считаются
    // инверсии: пары костяшек, где большая стоит левее меньшей (в порядке выбранной нумерации); E не учитывается
    const tl = cellOf.map(cell => board[cell]).filter(v => v !== SZ);
    let inv = 0;
    for (let i = 0; i < tl.length; i++)
      for (let j = i + 1; j < tl.length; j++) if (tl[i] > tl[j]) inv++;
    const parts = cycles.filter(s => s.length > 1).map(s => s.length - 1);
    const transp = parts.reduce((a, b) => a + b, 0);
    // Чётность с учётом положения E. Каждый ход — транспозиция, поэтому чётность перестановки (с E) и чётность
    // расстояния E до своей клетки (номер 16) меняются вместе: расклад собирается, если они совпадают.
    // Это то же самое, что «инверсии + поправка за E» чётны, где поправка — чётность (номер клетки E + расстояние
    // до её дома). Для построчной нумерации она равна номеру строки E (сверху, с 1). У змейки, двух кругов и
    // четвертей соседние клетки всегда имеют номера разной чётности (обход идёт по соседним клеткам), поэтому
    // поправка там всегда чётная, то есть её нет: достаточно чётности самих инверсий.
    const e = board.indexOf(SZ), home = cellOf[SZ - 1];
    const distE = Math.abs(Math.floor(e / N) - Math.floor(home / N)) + Math.abs(e % N - home % N);
    const isRows = numbering.id === 'rows';
    const corr = isRows ? Math.floor(e / N) + 1 : 0;
    const rowEven = (inv + corr) % 2 === 0;
    const solvable = transp % 2 === distE % 2;
    document.getElementById('parity').innerHTML =
      [t('pCycles', parts.length),
       t('pTransp', transp, parts),
       t('pParity', transp % 2 === 0),
       t('pInv', inv),
       t('pRow', rowEven, inv, corr, isRows),
       t('pSolv', solvable)].join('<br>');

    // единицы и подсветка костяшек
    for (let v = 1; v <= SZ; v++) {
      const col = idxOf[board.indexOf(v)]; // номер клетки, в которой стоит v
      const g = ones[v], inf = info[v];
      g.style.transform = `translate(${col * S}px, ${v * S}px)`;
      const clr = inf.fixed ? 'var(--ok)' : inf.color;
      if (v === SZ) g.firstChild.setAttribute('stroke', clr); // пустое поле: только рамка
      else g.firstChild.setAttribute('fill', clr);
      g.lastChild.textContent = t('oneTitle', v === SZ, v, col);
      if (v < SZ) {
        tiles[v].classList.toggle('home', !!inf.fixed);
        tiles[v].firstChild.style.setProperty('--dot', inf.fixed ? 'transparent' : inf.color);
      }
    }
  }

  // применить язык к статическим элементам, затем перерисовать динамические строки
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(n => { n.title = t(n.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', t(n.dataset.i18nAria)); });
    document.getElementById('lang').value = lang;
    updateHint();
    if (won) setWinText();
    render();
  }
  document.getElementById('lang').addEventListener('change', ev => {
    lang = ev.target.value;
    try { localStorage.setItem('lang', lang); } catch (e) { /* хранилище недоступно — не страшно */ }
    applyLang();
  });

  // начальная нумерация из адреса: ?numbering=rows|snake|rings|quarters (или номер 1…4); по умолчанию — построчная
  const startNumbering = (() => {
    const q = new URLSearchParams(location.search).get('numbering');
    if (q === null) return NUMBERINGS[0].id;
    const byId = NUMBERINGS.find(n => n.id === q.trim().toLowerCase());
    return (byId || NUMBERINGS[parseInt(q, 10) - 1] || NUMBERINGS[0]).id;
  })();
  chooseNumbering(startNumbering);
  newGame();               // первая партия
  setFree(false);
  applyLang();
})();
</script>
</body>
</html>
